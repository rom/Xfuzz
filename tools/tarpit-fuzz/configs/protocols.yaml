# tarpit-fuzz protocol configuration.
#
# Every one of the honeypot's 322 handlers is listed below, grouped by
# transport. Each row has:
#   - name:      the handler name (as tarpit-honeypot list-handlers prints)
#   - transport: tcp or udp (both when the handler serves each)
#   - enabled:   true to fuzz, false to skip
#   - port:      optional override; the registry's default is used when absent
#
# Toggles are the point: set enabled: false on protocols you do not deploy, on
# anything the host cannot reach, or on the ones a soak run has already
# cleared and you want to re-run only the rest. The CLI flags --enable and
# --disable take the same qualified name ("udp:dns"), and win against this
# file.
#
# The handler list tracks tarpit-honeypot's internal/config/load.go; a drift
# between the two is a regression this repo's CI flags.

target: 127.0.0.1
liveness: http://127.0.0.1:8088/healthz
iterations: 256
rounds: 1
concurrency: 8
timeout: 800ms
kinds: [dumb, smart]

