# Xfuzz CI — implements the matrix in docs/TESTS.md section 10.
#
# Every job maps to a numbered test layer from that document. Jobs run direct
# `go` commands rather than `make` where portability matters (Windows runners do
# not ship make), and use the Makefile where it is the thing under test.

name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  # Layer 10 — static checks, documentation traceability, licence policy, and
  # the architecture boundaries of docs/ARCHITECTURE.md section 2.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: architecture boundaries
        run: make lint-arch
      - name: documentation traceability
        run: make lint-docs
      - name: dependency licence policy
        run: make lint-license

  # Layers 1-2 — unit, property, and round-trip tests on every supported OS.
  #
  # The race detector runs on Linux and macOS. It is omitted on Windows, where
  # it requires a working cgo toolchain that the hosted image does not
  # guarantee; that job compensates by also building every command.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: build
        run: go build ./...
      # An explicit timeout rather than the ten-minute default: internal/engine
      # holds measurement tests that run campaigns of tens of thousands of
      # executions, because "the comparison stage makes the difference" is not a
      # claim a handful of executions can support. On a two-core hosted runner
      # that package sits close to the default and has gone over it, and a
      # package killed at the limit reports a goroutine dump rather than a
      # result — which reads as a hang in the fuzzer rather than a slow machine.
      #
      # Forty-five minutes rather than thirty, which is what the security job
      # below already allows for the same package for the same reason. Measured
      # here at 30m: internal/engine was killed mid-run after forty minutes,
      # inside a twenty-thousand-execution cmplog campaign, still doing work —
      # and the security job, running the same package under the same race
      # detector, finished it. One number for one package, in the two jobs that
      # both run it.
      - name: test (race)
        if: runner.os != 'Windows'
        run: go test -race -timeout 45m ./...
      - name: test
        if: runner.os == 'Windows'
        run: go test -timeout 30m ./...
      - name: build commands
        run: |
          go build -o /dev/null ./cmd/xfuzz
          go build -o /dev/null ./cmd/xfuzzd
          go build -o /dev/null ./cmd/xfuzz-worker
          go build -o /dev/null ./cmd/xfuzz-cc
        if: runner.os != 'Windows'
      - name: build commands (windows)
        if: runner.os == 'Windows'
        run: |
          go build -o NUL ./cmd/xfuzz
          go build -o NUL ./cmd/xfuzzd
          go build -o NUL ./cmd/xfuzz-worker
          go build -o NUL ./cmd/xfuzz-cc

  # Layer 3 of docs/TESTS.md: planted-bug targets driven through a whole
  # coverage-guided worker. This is the job that detects the defining failure of
  # a fuzzer — running beautifully and finding nothing — and the only one that
  # can. It needs clang for instrumentation and takes minutes, so it runs
  # separately from the fast suite and without the race detector.
  integration:
    name: integration (planted bugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: clang version
        run: clang --version
      - name: run integration tests
        run: make test-integration

  # Layer 9 / ASR-0006 — the cross-platform criterion: a subprocess campaign,
  # end to end, on every platform Xfuzz supports.
  #
  # Separate from the integration job because that one needs clang, which a
  # Windows runner does not have, and because the path being measured is a
  # different one: no coverage instrumentation, no isolation, a target the Go
  # toolchain already present can build. This is what ADR-0020 scoped macOS and
  # Windows to, so this is the job that says whether they have it.
  portable:
    name: subprocess campaign (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: run a black-box campaign end to end
        run: go test -tags integration -timeout 20m -run Platform -v ./test/e2e/

  # Layer 7 — self-fuzzing. Xfuzz's own untrusted-input surface, fuzzed with
  # Go's native fuzzing (ADR-0021, docs/TESTS.md section 8).
  #
  # The corpus is cached across runs so coverage accumulates rather than
  # restarting from the seeds every build; that is the difference between a
  # fuzzing job and a fuzzing gesture. Any crash, hang, or out-of-memory is a
  # release blocker, and the input that caused it is uploaded so it can be
  # reproduced without re-finding it.
  fuzz:
    name: self-fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: restore the accumulated fuzzing corpus
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
      - name: fuzz every parser
        run: make fuzz-all FUZZTIME=60s
      - name: keep the input that broke it
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  # Layer 12 / ASR-0010 — the escape attempts. docs/TESTS.md section 12 makes
  # every claim in SECURITY.md an executable test: a target that writes outside
  # its directory, forks without bound, allocates without bound, and calls a
  # privileged syscall, plus the scope guard, the authorization record, and the
  # audit log's hash chain.
  #
  # Its own job, and on Linux, because that is where the mechanisms are: user
  # namespaces, cgroups, and seccomp (ADR-0022). Elsewhere these tests skip with
  # a reason, so running them there would prove nothing and cost a runner.
  #
  # Each test distinguishes "contained" from "the target never ran". A sandbox
  # test that passes because nothing started is the one failure mode that would
  # never be noticed, so the suite asserts the effect rather than the
  # configuration — which is also why a skip here is a gap and not a pass.
  security:
    name: security (escape attempts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: clang version
        run: clang --version
      - name: run the escape attempts
        run: make test-security
      - name: only the known skips, and no others
        run: |
          # A skip is how this suite reports "the mechanism is not here", and a
          # security job must not go green on an unexplained one.
          #
          # This started as "no skips at all", on the assumption that a hosted
          # Linux runner has every mechanism. That assumption was wrong, and
          # finding out is why the job exists: these runners mount cgroup v2 and
          # delegate it, so a process cannot create a group and memory limits
          # cannot be enforced. The suite now detects that and skips the memory
          # test honestly instead of testing a sandbox that silently applied
          # nothing.
          #
          # So the rule is an allowlist rather than a count. Exactly the skips
          # named here are tolerated; any other one fails, which is the property
          # the original rule was reaching for.
          go test -tags security -run Security -v ./... 2>&1 | tee /tmp/sec.log
          unexpected=$(grep -- '--- SKIP' /tmp/sec.log | grep -v 'TestSecurityMemoryExhaustion' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::a security test skipped for a reason this job does not know about"
            echo "$unexpected"
            grep -A2 -- '--- SKIP' /tmp/sec.log
            exit 1
          fi
          if grep -q -- '--- SKIP: TestSecurityMemoryExhaustion' /tmp/sec.log; then
            echo "::warning::memory limits are not enforceable on this runner (delegated cgroups); containment for them is unverified here"
          fi
          ran=$(grep -c -- '--- PASS' /tmp/sec.log)
          echo "$ran security tests passed"
          # Guards against the suite silently emptying: a build tag that stops
          # matching, or a rename, would otherwise report a green job that ran
          # nothing at all.
          if [ "$ran" -lt 10 ]; then
            echo "::error::only $ran security tests ran; docs/TESTS.md section 12 lists more than that"
            exit 1
          fi

  # ADR-0023 — the floor in go.mod is a claim that somebody can build this with
  # that Go and no newer one. Every other job now runs on `stable`, so without
  # this one nothing would ever exercise the version the README tells people to
  # install, and the floor would drift into a number that happens to be written
  # down.
  #
  # It is the only job that reads the toolchain from go.mod, and deliberately so:
  # deriving *every* job's toolchain from the floor is what pinned this project
  # to a year-old patch release with 27 reachable standard-library
  # vulnerabilities.
  floor:
    name: build at the go.mod floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: the floor is a real version
        run: go version
      - name: build
        run: go build ./...
      - name: test
        run: go test -timeout 30m ./...

  # ADR-0017 — the pure-Go build must always work. A CGO_ENABLED=0 binary is
  # slower or less featureful, never broken.
  nocgo:
    name: test (linux, CGO_ENABLED=0)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: build
        run: go build ./...
      - name: test
        run: go test -timeout 30m ./...
      - name: version reports nocgo
        run: go run ./cmd/xfuzz --version | grep -q nocgo

  # ASR-0006 — every supported platform must compile from a single host.
  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - run: make cross

  # Supply-chain scan (docs/TESTS.md section 11).
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  # Layer 6 — performance gates.
  #
  # Timing is host-dependent, so what is gated depends on what can be compared
  # fairly:
  #   * On a pull request, the base branch is measured on THIS runner and
  #     compared against the head, so every metric is gated.
  #   * On a push, the only reference is the committed baseline, recorded on
  #     another machine. Only host-independent metrics (allocation counts and
  #     bytes) are gated; timings are measured and reported.
  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: measure head
        run: make bench

      - name: compare against committed baseline (allocations only)
        if: github.event_name != 'pull_request'
        run: |
          # The spawning benchmarks are measured and reported here, never
          # gated. "Allocation counts are host-independent" is true of a
          # computation and false of anything that goes through the safety
          # layer, because how many allocations a spawn costs depends on which
          # confinement mechanisms the host provides. Measured across two hosts:
          # all three reported allocations up 37-45% while bytes went *down*
          # 3-8% — the same work divided differently, gated as a regression.
          # On a pull request both sides run on one runner, so the comparison
          # below gates them like everything else.
          go run ./tools/benchcmp \
            -baseline bench/baseline.txt \
            -current bench/current.txt \
            -gate-units allocs/op,B/op \
            -host-dependent BenchmarkProcPool,BenchmarkSubprocess,BenchmarkSubprocessNop,BenchmarkForkServer/nop,BenchmarkForkServer/nop+coverage,BenchmarkForkServer/simple_parser+coverage,BenchmarkSession

      - name: measure base branch on this runner
        if: github.event_name == 'pull_request'
        run: |
          cp bench/current.txt "$RUNNER_TEMP/head.txt"
          git checkout --detach "origin/${{ github.base_ref }}"
          make bench
          cp bench/current.txt "$RUNNER_TEMP/base.txt"
          git checkout --detach "${{ github.sha }}"

      - name: compare head against base (all metrics)
        if: github.event_name == 'pull_request'
        run: |
          go run ./tools/benchcmp \
            -baseline "$RUNNER_TEMP/base.txt" \
            -current "$RUNNER_TEMP/head.txt" \
            -threshold 0.10
